<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f2f2">
  <title>Anybox</title>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">{"imports":{"@anybox/application-api/web":"/application-api/web.js"}}</script>
  <script type="module" src="/host/web/client.js"></script>
</head>
<body>
  <div id="workbench" class="workbench">
    <button id="show-application-menu" type="button" title="Anybox 应用菜单" aria-label="Anybox 应用菜单" aria-description="点击展开菜单，拖动调整位置" aria-expanded="false" aria-controls="application-menu" popovertarget="application-menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
    </button>
    <aside id="application-menu" popover="auto" aria-label="Anybox 应用菜单">
      <div id="application-menu-heading" class="application-menu-heading">应用</div>
      <div id="application-menu-list" aria-label="切换应用"></div>
      <div id="application-actions" role="group" aria-label="当前应用操作" hidden>
        <button id="close-application" type="button" title="关闭当前应用界面" aria-label="关闭当前应用界面" hidden>关闭当前界面</button>
        <button id="stop-application" type="button" title="停止当前应用" aria-label="停止当前应用" hidden>停止当前应用</button>
      </div>
      <div class="application-language-control"><label id="application-language-label" for="application-language">语言</label><select id="application-language" aria-labelledby="application-language-label"><option value="system">跟随系统</option><option value="zh-CN" lang="zh-CN">简体中文</option><option value="en" lang="en">English</option></select></div>
      <div class="application-menu-footer"><button id="show-applications" type="button" aria-label="管理应用" aria-haspopup="dialog" aria-controls="application-manager">管理应用</button></div>
    </aside>
    <dialog id="application-manager" aria-labelledby="application-manager-title">
      <header class="application-manager-header"><h2 id="application-manager-title">应用管理</h2><div class="application-manager-tools"><div id="application-install-actions"></div><button id="close-application-manager" type="button" aria-label="关闭应用管理" title="关闭应用管理" autofocus>×</button></div></header>
      <p id="workbench-notice" role="status" class="notice" hidden></p>
      <section id="application-list" aria-label="已安装应用"></section>
    </dialog>
    <main class="workbench-content"><div id="application-panels"></div></main>
  </div>
</body>
</html>
