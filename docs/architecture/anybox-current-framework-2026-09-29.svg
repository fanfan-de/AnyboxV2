<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1270" viewBox="0 0 1600 1270" role="img" aria-labelledby="title description">
<title id="title">AnyboxV2 当前框架：单根组件与 Harness 逻辑边界</title>
<desc id="description">以 2026 年 9 月 29 日当前源码为准。浏览器通过本机 Web 接口操作同一个 Nya 根中的 Harness、Models 与存储组件。Harness 尚未抽包，远程连接尚未实现。图展示分组与主要交互，详细关系见 Mermaid 源码。</desc>
