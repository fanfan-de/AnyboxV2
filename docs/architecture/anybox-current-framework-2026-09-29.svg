<text x="185" y="1181" font-size="18" fill="#546b84" font-weight="400">Provider 原生 API ← 协议驱动     |     models.dev ← Catalog Source</text>
<text x="68" y="1208" font-size="16" fill="#64798e" font-weight="400">系统资源：系统凭据库、项目目录与子进程、图片原字节目录；客户端仅接收允许展示的投影。</text>
<text x="48" y="1251" font-size="16" fill="#6b7f93" font-weight="400">实线：主要调用入口    虚线：装配、持久化或外部边界    组内以职责归属为主；详细关系见随附 Mermaid。</text>
