<text x="1090" y="960" font-size="16" fill="#516778" font-weight="400">独占 models-catalog.sqlite</text>
<path d="M 492 937 L 492 978" fill="none" stroke="#6c8197" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="511" y="964" font-size="16" fill="#667b8e" font-weight="400">领域表与同一业务事务</text>
<rect x="56" y="979" width="936" height="118" rx="16" fill="#f2f5f8" stroke="#b7c5d2"/>
<text x="80" y="1011" font-size="22" fill="#43576b" font-weight="650">基础设施  ·  local-sqlite / local-storage</text>
<text x="80" y="1042" font-size="17" fill="#5b6e81" font-weight="400">独占 harness.sqlite：Session / Run / Prompt / Projects / 图片引用 / 文件快照</text>
<text x="80" y="1072" font-size="16" fill="#5b6e81" font-weight="400">领域组件各自登记迁移。图片原字节由图片组件独占目录保存，工具操作宿主项目文件。</text>
<text x="1052" y="1049" font-size="16" fill="#667d98" font-weight="400">Models 为独立包；DeepSeek 扩展仍在宿主。</text>
<text x="1052" y="1075" font-size="16" fill="#667d98" font-weight="400">三套 SQLite 独占连接，文件路径互不共用。</text>
<text x="56" y="1119" font-size="16" fill="#62748b" font-weight="400">关闭入口：harness.close() → 停止准入 → Nya 卸载根上组件 → 取消并等待实际退出与清理</text>
<path d="M 1544 676 L 1556 676 L 1556 1177 L 1500 1177" fill="none" stroke="#6c8197" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
