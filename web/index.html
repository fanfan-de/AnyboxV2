<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f2f2">
  <title>Anybox</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/host/web/client.js"></script>
</head>
<body>
  <div class="workbench">
    <nav class="product-rail" aria-label="应用导航">
      <strong class="anybox-wordmark">A</strong>
      <button id="show-applications" type="button" title="我的应用" aria-label="我的应用" aria-expanded="false" aria-controls="application-manager" popovertarget="application-manager">▦</button>
      <div id="application-shortcuts" aria-label="应用入口"></div>
      <div id="application-actions" role="group" aria-label="当前应用操作" hidden>
        <button id="close-application" type="button" title="关闭当前应用界面" aria-label="关闭当前应用界面" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        <button id="stop-application" type="button" title="停止当前应用" aria-label="停止当前应用" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
      </div>
    </nav>
    <aside id="application-manager" popover="auto" aria-labelledby="application-manager-title">
      <header class="application-manager-header"><h2 id="application-manager-title">我的应用</h2><button type="button" aria-label="关闭应用管理" title="关闭应用管理" popovertarget="application-manager" popovertargetaction="hide">×</button></header>
      <p id="workbench-notice" role="status" class="notice" hidden></p>
      <section id="application-list" aria-label="应用列表"></section>
    </aside>
    <main class="workbench-content"><div id="application-panels"></div></main>
  </div>
</body>
</html>
